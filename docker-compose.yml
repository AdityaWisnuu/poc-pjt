services:
  postgres:
    image: postgres:17-alpine
    container_name: poc-pjt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pjt
      POSTGRES_PASSWORD: pjt_local_only
      POSTGRES_DB: pjt
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - pjt_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pjt -d pjt']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pjt_pg:
