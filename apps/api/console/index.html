<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PJT Settlement Console</title>
<link rel="icon" href="data:,">
<style>
@font-face { font-family: "Jakarta"; src: url("/console/assets/font.ttf") format("truetype"); font-weight: 200 800; }
:root {
  --ink: #07080c; --surface: #111319; --surface-2: #1a1d25; --line: rgba(255,255,255,.075);
  --text: #f6f7f9; --muted: #9398a6; --faint: #5e6371; --mint: #22edb3; --coral: #ff6645; --cobalt: #3f63ff;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; background: var(--ink); color: var(--text); font-family: "Jakarta", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; }
.app { height: 100vh; min-height: 720px; display: grid; grid-template-rows: 62px minmax(0, 1fr) 112px; gap: 14px; padding: 14px 20px 18px; }
header { display: flex; align-items: center; gap: 14px; }
.brand { font-size: 27px; font-weight: 800; letter-spacing: -.055em; }
.title { color: var(--muted); font-size: 15px; font-weight: 600; padding-left: 14px; border-left: 1px solid var(--line); }
.head-right { margin-left: auto; display: flex; gap: 24px; align-items: center; color: var(--muted); font-size: 13.5px; font-weight: 600; }
.head-right b { color: var(--text); font-weight: 650; font-variant-numeric: tabular-nums; }
#mode.live { color: var(--mint); }
main { min-height: 0; display: grid; grid-template-columns: minmax(420px, 5fr) minmax(560px, 7fr); gap: 14px; }

.hero { position: relative; overflow: hidden; border-radius: 30px; background: var(--surface); display: flex; flex-direction: column; padding: 30px; min-height: 0; }
#aurora { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero > *:not(canvas) { position: relative; }
.phase { font-size: 15px; font-weight: 650; color: rgba(255,255,255,.88); min-height: 22px; }
.amount { margin-top: 8px; font-size: clamp(48px, 5.6vw, 84px); line-height: 1.02; font-weight: 750; letter-spacing: -.045em; font-variant-numeric: tabular-nums; }
.merchant { margin-top: 10px; font-size: 18px; font-weight: 650; color: rgba(255,255,255,.92); min-height: 24px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.value-flow { margin-top: auto; background: rgba(7,8,12,.78); border: 1px solid var(--line); border-radius: 24px; padding: 18px 20px; backdrop-filter: blur(16px); }
.value-label { font-size: 12.5px; font-weight: 650; color: var(--muted); margin-bottom: 14px; }
.nodes { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); }
#flow { position: absolute; left: 12.5%; right: 12.5%; top: 0; height: 46px; width: 75%; }
.node { position: relative; display: flex; flex-direction: column; align-items: center; gap: 7px; min-width: 0; opacity: .38; transition: opacity .45s; }
.node.on { opacity: 1; }
.coin { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-size: 16px; font-weight: 800; transition: transform .5s cubic-bezier(.2,1.5,.4,1), box-shadow .5s; }
.coin img { width: 46px; height: 46px; display: block; }
.node.now .coin { transform: scale(1.14); box-shadow: 0 0 0 5px rgba(34,237,179,.18); }
.node .sym { font-size: 13px; font-weight: 750; }
.node .val { font-family: var(--mono); font-size: 11.5px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.rail { background: var(--surface); border: 1px solid var(--line); border-radius: 30px; padding: 12px 22px; min-height: 0; overflow: auto; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
.leg { font-size: 11.5px; font-weight: 750; letter-spacing: .09em; color: var(--faint); padding: 8px 0 2px 46px; }
.step { position: relative; display: grid; grid-template-columns: 46px minmax(150px, 215px) minmax(0, 1fr) 64px; align-items: center; min-height: 54px; opacity: .36; transition: opacity .4s; }
.step.done, .step.active, .step.failed { opacity: 1; }
.step::before { content: ""; position: absolute; left: 13px; top: 39px; height: calc(100% - 25px); width: 2px; border-radius: 2px; background: var(--surface-2); }
.step.last::before { display: none; }
.step.done::before { background: linear-gradient(var(--mint), rgba(34,237,179,.3)); }
.dot { width: 28px; height: 28px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; color: var(--ink); transition: background .3s, transform .4s cubic-bezier(.2,1.7,.4,1); }
.step.done .dot { background: var(--mint); transform: scale(1.02); }
.step.failed .dot { background: var(--coral); }
.step.active .dot { background: transparent; border: 3px solid var(--surface-2); border-top-color: var(--text); animation: spin .8s linear infinite; }
.dot svg { width: 15px; height: 15px; display: none; }
.step.done .check, .step.failed .cross { display: block; }
.step-name { font-size: 15px; font-weight: 700; }
.step-sub { margin-top: 1px; font-size: 12px; color: var(--muted); }
.proof { min-width: 0; display: flex; flex-wrap: wrap; gap: 3px 16px; font-family: var(--mono); font-size: 12px; color: var(--muted); line-height: 1.45; }
.proof b { color: var(--text); font-weight: 550; }
.proof span { white-space: nowrap; animation: rise .42s ease-out both; }
.time { text-align: right; font-family: var(--mono); font-size: 12px; color: var(--muted); }

.metrics { display: grid; grid-template-columns: repeat(4, 1fr) minmax(250px, 1.35fr); gap: 14px; min-height: 0; }
.metric { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 17px 20px; min-width: 0; }
.metric small { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.metric strong { display: block; margin-top: 6px; font-size: clamp(22px, 2.2vw, 31px); font-weight: 750; letter-spacing: -.035em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.metric em { font-style: normal; font-size: .55em; font-weight: 650; color: var(--muted); letter-spacing: 0; margin-left: 3px; }
.history { padding: 10px 8px; overflow: auto; }
.history button { width: 100%; display: flex; gap: 10px; justify-content: space-between; padding: 5px 10px; color: var(--muted); background: none; border: 0; border-radius: 10px; font: 600 12.5px "Jakarta", sans-serif; cursor: pointer; }
.history button:hover, .history button.sel { background: var(--surface-2); color: var(--text); }
.history span:first-child { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.history span:last-child { font-variant-numeric: tabular-nums; }
.failure { margin-top: 12px; color: #ffd8cf; font-size: 14px; font-weight: 600; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
@media (max-width: 1080px) {
  .app { height: auto; grid-template-rows: auto auto auto; }
  main { grid-template-columns: 1fr; }
  .hero { min-height: 480px; }
  .step { grid-template-columns: 42px 1fr 58px; padding: 6px 0; }
  .proof { grid-column: 2 / 4; grid-row: 2; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .history { grid-column: 1 / -1; max-height: 150px; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">pjt</div>
    <div class="title">Settlement Console</div>
    <div class="head-right"><span id="mode">—</span><b id="clock">—</b></div>
  </header>
  <main>
    <section class="hero">
      <canvas id="aurora"></canvas>
      <div class="phase" id="phase">Menunggu pembayaran</div>
      <div class="amount" id="amount">Rp—</div>
      <div class="merchant" id="merchant"></div>
      <div class="failure" id="failure" hidden></div>
      <div class="value-flow">
        <div class="value-label">Perjalanan nilai</div>
        <div class="nodes" id="nodes">
          <canvas id="flow"></canvas>
          <div class="node" data-node="0"><div class="coin"><img id="sourceLogo" src="/console/assets/usdc.svg" alt=""></div><div class="sym" id="sourceSym">USDC</div><div class="val" id="v0">—</div></div>
          <div class="node" data-node="1"><div class="coin">SA</div><div class="sym">Settlement</div><div class="val" id="v1">—</div></div>
          <div class="node" data-node="2"><div class="coin">Rp</div><div class="sym">IDR</div><div class="val" id="v2">—</div></div>
          <div class="node" data-node="3"><div class="coin" style="background:var(--text);color:var(--ink)">M</div><div class="sym">Merchant</div><div class="val" id="v3">—</div></div>
        </div>
      </div>
    </section>
    <section class="rail" id="rail"></section>
  </main>
  <section class="metrics">
    <div class="metric"><small>Waktu end-to-end</small><strong id="mTime">—</strong></div>
    <div class="metric"><small>Biaya transfer</small><strong id="mCost">—</strong></div>
    <div class="metric"><small id="balanceLabel">Saldo payer</small><strong id="mBalance">—</strong></div>
    <div class="metric"><small>Merchant menerima</small><strong id="mMerchant">—</strong></div>
    <div class="metric history" id="history"></div>
  </section>
</div>

<script>
const STEPS = [
  { id: 'request', leg: null, name: 'Payment Request', sub: 'QRIS terbaca, kurs dikunci', at: ['CREATED'] },
  { id: 'transfer', leg: 'FUNDING LEG', name: 'Value Transfer', sub: 'Aset ke Settlement Account', at: ['SENDING_ASSET'] },
  { id: 'funding', leg: null, name: 'Funding Confirmed', sub: 'Riwayat WD PAKD: success', at: ['AWAITING_RECEIPT'] },
  { id: 'payment', leg: 'PAYMENT LEG', name: 'Payment Execution', sub: 'Konversi ke IDR, bayar QRIS · Simulasi', at: ['PAYING_MERCHANT'] },
  { id: 'done', leg: null, name: 'Payment Confirmed', sub: 'Merchant menerima rupiah', at: ['SUCCESS'] },
];
const ORDER = ['CREATED','SENDING_ASSET','AWAITING_RECEIPT','PAYING_MERCHANT','SUCCESS'];
const PHASE = { CREATED:'Payment Request', SENDING_ASSET:'Funding Leg', AWAITING_RECEIPT:'Funding Leg', PAYING_MERCHANT:'Payment Leg', SUCCESS:'Settlement selesai', FAILED:'Settlement gagal', NEEDS_REVIEW:'Perlu ditinjau' };
const $ = (id) => document.getElementById(id);
const idr = (n) => 'Rp' + Number(n).toLocaleString('id-ID');
const num = (n, d = 0) => Number(n).toLocaleString('id-ID', { minimumFractionDigits: d, maximumFractionDigits: d });
const amt = (asset, n) => asset === 'IDRX' ? num(n) : num(n, 6);
const wib = (iso) => new Intl.DateTimeFormat('id-ID', { timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit', second: '2-digit' }).format(new Date(iso)).replaceAll(':', '.');
const secs = (ms) => (ms / 1000).toLocaleString('id-ID', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + 'd';

let state = null, selected = null, follow = true, energy = 0, targetEnergy = 0, success = 0, targetSuccess = 0, activeNode = -1;

function buildRail() {
  const rail = $('rail');
  STEPS.forEach((s, i) => {
    if (s.leg) { const l = document.createElement('div'); l.className = 'leg'; l.textContent = s.leg; rail.append(l); }
    const row = document.createElement('div');
    row.className = 'step' + (i === STEPS.length - 1 ? ' last' : '');
    row.id = 'step-' + s.id;
    row.innerHTML = '<div class="dot"><svg class="check" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5 6.5 12 13 4.5"/></svg><svg class="cross" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="m4 4 8 8M12 4l-8 8"/></svg></div><div><div class="step-name"></div><div class="step-sub"></div></div><div class="proof"></div><div class="time"></div>';
    row.querySelector('.step-name').textContent = s.name;
    row.querySelector('.step-sub').textContent = s.sub;
    rail.append(row);
  });
}

function proofs(o, id) {
  const e = o.evidence || {};
  if (id === 'request') return o.asset === 'IDRX'
    ? [['Aset', 'IDRX'], ['Alokasi', amt('IDRX', o.quote.assetPlanned) + ' IDRX']]
    : [[o.asset + '/IDR', num(o.quote.assetIdrBid)], ['Alokasi', amt(o.asset, o.quote.assetPlanned) + ' ' + o.asset]];
  if (id === 'transfer' && e.transfer) return [['WD', e.transfer.withdrawId], ['TxID', e.transfer.txId], ['Kirim', amt(o.asset, e.transfer.amount) + ' ' + o.asset], ['Callback', e.transfer.authorization === 'approved' ? 'Disetujui' : '—']];
  if (id === 'funding' && e.funding) return [['Oleh', e.funding.confirmedBy], ...(e.transfer?.completedAt ? [['Selesai', wib(e.transfer.completedAt) + ' WIB']] : [])];
  if (id === 'payment' && e.payment) return [['Oleh', e.payment.executedBy], ['Kanal', e.payment.channel]];
  if (id === 'done' && e.payment) return [['Diterima', idr(e.payment.amountIdr)]];
  return [];
}

function render() {
  if (!state) return;
  $('mode').textContent = state.mode === 'live' ? 'Live' : 'Mode simulasi';
  $('mode').className = state.mode === 'live' ? 'live' : '';
  renderHistory();
  const o = state.orders.find((x) => x.id === selected) || state.orders[0];
  if (!o) return;
  selected = o.id;

  const failed = o.status === 'FAILED' || o.status === 'NEEDS_REVIEW';
  const reached = o.timeline.map((t) => t.status).filter((s) => ORDER.includes(s));
  const idx = failed ? Math.max(...reached.map((s) => ORDER.indexOf(s))) : ORDER.indexOf(o.status);
  const stepIndex = (s) => ORDER.indexOf(s.at[0]);
  const running = !failed && o.status !== 'SUCCESS';

  $('phase').textContent = PHASE[o.status] || o.status;
  $('amount').textContent = idr(o.amountIdr);
  $('merchant').textContent = o.merchantName + (o.merchantCity ? ' · ' + o.merchantCity : '');
  $('failure').hidden = !failed;
  $('failure').textContent = failed ? (o.failureReason || 'Terjadi kesalahan') : '';

  STEPS.forEach((s, i) => {
    const row = $('step-' + s.id);
    const si = stepIndex(s);
    const done = o.status === 'SUCCESS' ? true : si < idx || (s.id === 'request' && idx > 0);
    const active = !failed && o.status !== 'SUCCESS' && si === idx && s.id !== 'request';
    const broken = failed && si === idx;
    if (s.id === 'transfer') row.querySelector('.step-sub').textContent = o.asset + ' ke Settlement Account';
    const cls = 'step' + (i === STEPS.length - 1 ? ' last' : '') + (done ? ' done' : active || (s.id === 'request' && idx === 0 && running) ? ' active' : broken ? ' failed' : '');
    if (row.className !== cls) row.className = cls;

    const p = proofs(o, s.id);
    const key = JSON.stringify(p);
    const box = row.querySelector('.proof');
    if (box.dataset.key !== key) {
      box.dataset.key = key;
      box.replaceChildren(...p.map(([k, v], n) => {
        const span = document.createElement('span');
        span.style.animationDelay = n * 55 + 'ms';
        span.append(k === '#' ? '#' : k ? k + ' ' : '');
        const b = document.createElement('b'); b.textContent = v; span.append(b);
        return span;
      }));
    }
    const start = o.timeline.find((t) => t.status === s.at[0]);
    const nextStatus = ORDER[si + 1];
    const end = o.timeline.find((t) => t.status === nextStatus);
    row.querySelector('.time').textContent = s.id !== 'done' && s.id !== 'request' && start && end ? secs(new Date(end.at) - new Date(start.at)) : '';
  });

  const e = o.evidence || {};
  $('sourceLogo').src = '/console/assets/' + o.asset.toLowerCase() + '.svg';
  $('sourceSym').textContent = o.asset;
  $('balanceLabel').textContent = 'Saldo ' + o.asset + ' payer';
  $('v0').textContent = amt(o.asset, o.quote.assetPlanned);
  $('v1').textContent = e.transfer ? amt(o.asset, e.transfer.amount) : '—';
  const converting = o.status === 'PAYING_MERCHANT' || o.status === 'SUCCESS';
  $('v2').textContent = converting ? num(o.amountIdr) : '—';
  $('v3').textContent = e.payment ? num(e.payment.amountIdr) : '—';
  const nodeLevel = o.status === 'SUCCESS' || e.payment ? 3 : converting ? 2 : e.transfer ? 1 : 0;
  activeNode = running ? nodeLevel : -1;
  document.querySelectorAll('.node').forEach((n, i) => {
    n.classList.toggle('on', i <= nodeLevel);
    n.classList.toggle('now', running && i === nodeLevel);
  });

  $('mTime').textContent = o.totalMs != null ? secs(o.totalMs) : running ? 'Berjalan' : '—';
  $('mCost').replaceChildren();
  if (e.transfer) {
    $('mCost').append(Number(e.transfer.fee) === 0 ? '0' : amt(o.asset, e.transfer.fee));
    const u = document.createElement('em'); u.textContent = o.asset; $('mCost').append(u);
  } else $('mCost').textContent = '—';
  $('mBalance').replaceChildren();
  if (e.balances) {
    const places = o.asset === 'IDRX' ? 0 : 4;
    $('mBalance').append(num(e.balances.after ?? e.balances.usdcAfter, places));
    const u = document.createElement('em'); u.textContent = 'dari ' + num(e.balances.before ?? e.balances.usdcBefore, places); $('mBalance').append(u);
  } else $('mBalance').textContent = '—';
  $('mMerchant').textContent = e.payment ? idr(e.payment.amountIdr) : '—';

  targetEnergy = running ? 1 : 0;
  targetSuccess = o.status === 'SUCCESS' ? 0.42 : 0;
}

function renderHistory() {
  const box = $('history');
  const key = JSON.stringify(state.orders.map((o) => [o.id, o.status])) + selected;
  if (box.dataset.key === key) return;
  box.dataset.key = key;
  box.replaceChildren(...state.orders.slice(0, 6).map((o) => {
    const b = document.createElement('button');
    if (o.id === selected) b.className = 'sel';
    const a = document.createElement('span'); a.textContent = o.merchantName;
    const c = document.createElement('span'); c.textContent = idr(o.amountIdr);
    b.append(a, c);
    b.onclick = () => { selected = o.id; follow = o.id === state.orders[0].id; render(); };
    return b;
  }));
  if (!state.orders.length) { const m = document.createElement('small'); m.textContent = 'Belum ada transaksi'; m.style.padding = '8px 10px'; box.append(m); }
}

let fetching = false, again = false;
async function refresh() {
  if (fetching) { again = true; return; }
  fetching = true;
  try {
    const next = await (await fetch('/console/state', { cache: 'no-store' })).json();
    if (follow && next.orders[0] && (!state || next.orders[0].id !== state.orders[0]?.id)) selected = next.orders[0].id;
    state = next;
    render();
  } catch {}
  fetching = false;
  if (again) { again = false; refresh(); }
}

const events = new EventSource('/console/events');
events.addEventListener('change', refresh);
events.onopen = refresh;
setInterval(refresh, 4000);
setInterval(() => { $('clock').textContent = new Intl.DateTimeFormat('id-ID', { timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit', second: '2-digit' }).format(new Date()).replaceAll(':', '.') + ' WIB'; }, 250);

const FRAG = `precision highp float; uniform vec2 r; uniform float t,e,s;
float h(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float n(vec2 p){vec2 i=floor(p),f=fract(p),u=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),u.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),u.x),u.y);}
float b(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*n(p);p=p*2.02+vec2(1.7,9.2);a*=.5;}return v;}
void main(){vec2 uv=gl_FragCoord.xy/r;uv.y=1.-uv.y;vec2 p=vec2(uv.x*(r.x/r.y)*1.6,uv.y*1.6);float k=t*(.07+.22*e);
vec2 w=vec2(b(p+vec2(k,-k*.6)),b(p+vec2(-k*.8,k)+4.1));float f=b(p+1.9*w+vec2(k*.35,0.));float q=smoothstep(.34,.76,f);
vec3 ink=vec3(.067,.075,.098),co=vec3(.10,.25,.98),mi=vec3(.13,.93,.70),ro=vec3(1.,.40,.27);
vec3 c=mix(ink,co,q);c=mix(c,mi,smoothstep(.46,.86,w.x)*q*.86);c=mix(c,ro,smoothstep(.54,.84,w.y)*q*.62);c=mix(c,mi,s*(.35+.65*q));
c=mix(ink,c,clamp(smoothstep(1.02,.2,uv.y)*mix(.74,1.,e),0.,1.));gl_FragColor=vec4(c+(h(uv*r+fract(t))-.5)*.022,1.);}`;

function startAurora() {
  const canvas = $('aurora');
  const gl = canvas.getContext('webgl', { antialias: false, powerPreference: 'low-power' });
  if (!gl) return () => {};
  const compile = (type, src) => { const x = gl.createShader(type); gl.shaderSource(x, src); gl.compileShader(x); return x; };
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, 'attribute vec2 a;void main(){gl_Position=vec4(a,0,1);}'));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog); gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.bindAttribLocation(prog, 0, 'a'); gl.linkProgram(prog); gl.useProgram(prog);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  const u = { r: gl.getUniformLocation(prog, 'r'), t: gl.getUniformLocation(prog, 't'), e: gl.getUniformLocation(prog, 'e'), s: gl.getUniformLocation(prog, 's') };
  return (time) => {
    const scale = 0.6, w = Math.round(canvas.clientWidth * scale), h = Math.round(canvas.clientHeight * scale);
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h); }
    gl.uniform2f(u.r, w, h); gl.uniform1f(u.t, 40 + time / 1000); gl.uniform1f(u.e, energy); gl.uniform1f(u.s, success);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  };
}

function drawFlow(time) {
  const c = $('flow'), dpr = devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
  if (c.width !== Math.round(w * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
  const x = c.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, w, h);
  const shown = [...document.querySelectorAll('.node')];
  const y = h / 2, gap = 29, seg = w / (shown.length - 1);
  for (let i = 0; i < shown.length - 1; i++) {
    const a = i * seg + gap, b = (i + 1) * seg - gap;
    const lit = shown[i + 1].classList.contains('on');
    x.strokeStyle = lit ? 'rgba(34,237,179,.75)' : 'rgba(255,255,255,.11)'; x.lineWidth = 2; x.lineCap = 'round';
    x.beginPath(); x.moveTo(a, y); x.lineTo(b, y); x.stroke();
    if (activeNode === i) for (let k = 0; k < 3; k++) {
      const p = ((time / 900) + k / 3) % 1;
      x.fillStyle = `rgba(246,247,249,${Math.sin(p * Math.PI)})`;
      x.beginPath(); x.arc(a + (b - a) * p, y, 3.2, 0, 7); x.fill();
    }
  }
}

buildRail();
refresh();
const paintAurora = startAurora();
(function frame(time) {
  energy += (targetEnergy - energy) * 0.04;
  success += (targetSuccess - success) * 0.04;
  paintAurora(time); drawFlow(time);
  requestAnimationFrame(frame);
})(0);
</script>
